[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samantha"
version = "1.0.0"
description = "An import-and-go resident intelligence for Python programs"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# The two demos (python demo.py aliens|training). pygame-ce, not pygame:
# pygame-ce publishes wheels for current CPython releases, so nothing is built.
demos = ["pygame-ce>=2.5.2", "numpy>=2.1", "matplotlib>=3.9"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
samantha = "samantha.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/samantha"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
