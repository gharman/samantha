[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samantha"
version = "1.0.0"
description = "An import-and-go resident intelligence for Python programs"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["platformdirs>=4", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
samantha = "samantha.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/samantha"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
